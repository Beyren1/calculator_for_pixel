name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk calculator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: calculator.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Калькулятор, сборка ${{ github.run_number }}
          body: |
            Скачайте `calculator.apk` на телефон и установите его.
            Android попросит разрешить установку из этого источника: это нормально для приложений не из Google Play.
          files: calculator.apk
          make_latest: true
